font_size 14.0
# kitty rounds the advance of a glyph up. At 14 pt on a 2x display, the advance
# is 16.8 px, so the cell is 17 px, and this makes it 16 px.
modify_font cell_width -1px
# The beam and the underline cursor are 2 px wide. kitty gives them in pt, and
# 1 pt is 2 px on a 2x display.
cursor_beam_thickness 1.0
cursor_underline_thickness 1.0

# The window has no title bar, and the menu bar shows no title either.
macos_show_window_title_in none

# The tmux keys are not run here as "tmux" commands, see linux.conf for why.
# Cmd+digit, Cmd+T, Cmd+W and Cmd+Shift+[ and ] send the Alt keys that tmux
# binds for kitty on NixOS and for Termius. The other keys send the sequences
# of user-keys in tmux/.tmux.conf.
map cmd+c send_text all \x1b[5;30003~
map cmd+t send_text all \x1bt
map cmd+w send_text all \x1bw
map cmd+h hide_macos_app
map cmd+shift+[ send_text all \x1b{
map cmd+shift+] send_text all \x1b}
map cmd+alt+[ send_text all \x1b[5;30001~
map cmd+alt+] send_text all \x1b[5;30002~
map cmd+1 send_text all \x1b1
map cmd+2 send_text all \x1b2
map cmd+3 send_text all \x1b3
map cmd+4 send_text all \x1b4
map cmd+5 send_text all \x1b5
map cmd+6 send_text all \x1b6
map cmd+7 send_text all \x1b7
map cmd+8 send_text all \x1b8
map cmd+9 send_text all \x1b9
map cmd+0 send_text all \x1b0
map cmd+left send_text all \x1b[5;30004~
map cmd+right send_text all \x1b[5;30005~
map cmd+up send_text all \x1b[5;30006~
map cmd+down send_text all \x1b[5;30007~

# The usual keys of a macOS terminal.
map cmd+v paste_from_clipboard
# Ctrl+L clears the screen. The scrollback is in tmux, so kitty has none to
# clear.
map cmd+k send_text all \x0c
map cmd+n new_os_window
map cmd+q quit
map cmd+m minimize_macos_window
map cmd+alt+h hide_macos_other_apps
map ctrl+cmd+f toggle_fullscreen
map cmd+equal change_font_size all +1.0
map cmd+plus change_font_size all +1.0
map cmd+kp_add change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+kp_subtract change_font_size all -1.0
