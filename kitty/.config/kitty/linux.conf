font_size 10.0

map alt+v paste_from_selection

# The tmux keys (Alt+digit, Alt+T, Alt+W, Alt+Shift+[ and ]) are not bound
# here, so they go to tmux as keys, and tmux binds them. A "tmux" command
# that kitty runs is not in a client, and tmux then acts on the client with
# the most recent key. After Termius, that is the phone, and the keys went to
# the phone's session. Super does not get to tmux, so Alt+Super+[ and ] send
# the sequences of user-keys in tmux/.tmux.conf.
map alt+super+[ send_text all \x1b[5;30001~
map alt+super+] send_text all \x1b[5;30002~

# Copy, paste and the font size.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection
map ctrl+0 change_font_size all 0
map ctrl+equal change_font_size all +1.0
map ctrl+plus change_font_size all +1.0
map ctrl+kp_add change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
