# kitty draws bitmaps, see sh/sh/view-images.sh.

include theme.conf

font_family family="RecursiveMnLnrSt Nerd Font"
bold_font family="RecursiveMnLnrStBlk Nerd Font" style=Regular
italic_font family="RecursiveMnLnrSt Nerd Font" style=Italic
bold_italic_font family="RecursiveMnLnrStBlk Nerd Font" style=Italic
# Two more pixels between the lines.
modify_font cell_height +2px

scrollback_lines 100000
wheel_scroll_multiplier 1.0

hide_window_decorations yes

# Changes to the defaults of kitty. kitty draws no ligatures, does not blink
# the cursor and draws it and a selection with the colours of the cell swapped.
# It puts the pixels that are left over below and right of the text, and hides
# the mouse only on request. It has no bell sound, no confirmation to close and
# no shell integration. It mixes the edges of a glyph with the background in
# sRGB, which is the legacy strategy. It dims text to 66% of the sRGB value,
# and kitty mixes a dim colour in linear light, where 66% is 0.39.
disable_ligatures always
cursor none
cursor_blink_interval 0
selection_foreground none
selection_background none
placement_strategy top-left
text_composition_strategy legacy
dim_opacity 0.39
mouse_hide_wait 0
enable_audio_bell no
confirm_os_window_close 0
shell_integration disabled
macos_quit_when_last_window_closed yes

# The keys of kitty are for its own tabs and windows, which tmux replaces.
# The keys to keep come back in the file of the system. The file must come
# after this line, because the line removes the keys above it.
clear_all_shortcuts yes

include ${KITTY_OS}.conf
