[font]
size = 14

# The tmux keys are not run here as "tmux" commands, see nixos.toml for why.
# Cmd+digit, Cmd+T, Cmd+W and Cmd+Shift+[ and ] send the Alt keys that tmux
# binds for alacritty on NixOS and for Termius. The other keys send the
# sequences of user-keys in tmux/.tmux.conf.
[[keyboard.bindings]]
chars = "\u001b[5;30003~"
key = "C"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001bt"
key = "T"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001bw"
key = "W"
mods = "Command"

[[keyboard.bindings]]
key = "H"
mods = "Command"

[keyboard.bindings.command]
args = ["-e", "tell application \"System Events\" to tell process \"Alacritty\" to set visible to false"]
program = "osascript"

[[keyboard.bindings]]
chars = "\u001b{"
key = "LBracket"
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u001b}"
key = "RBracket"
mods = "Command|Shift"

[[keyboard.bindings]]
chars = "\u001b[5;30001~"
key = "LBracket"
mods = "Command|Alt"

[[keyboard.bindings]]
chars = "\u001b[5;30002~"
key = "RBracket"
mods = "Command|Alt"

[[keyboard.bindings]]
chars = "\u001b1"
key = "Key1"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b2"
key = "Key2"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b3"
key = "Key3"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b4"
key = "Key4"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b5"
key = "Key5"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b6"
key = "Key6"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b7"
key = "Key7"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b8"
key = "Key8"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b9"
key = "Key9"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b0"
key = "Key0"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b[5;30004~"
key = "Left"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b[5;30005~"
key = "Right"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b[5;30006~"
key = "Up"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001b[5;30007~"
key = "Down"
mods = "Command"
