[font]
size = 10

[[keyboard.bindings]]
action = "PasteSelection"
key = "V"
mods = "Alt"

# The tmux keys (Alt+digit, Alt+T, Alt+W, Alt+Shift+[ and ]) are not bound
# here, so they go to tmux as keys, and tmux binds them. A "tmux" command
# that alacritty runs is not in a client, and tmux then acts on the client with
# the most recent key. After Termius, that is the phone, and the keys went to
# the phone's session. Super does not get to tmux, so Alt+Super+[ and ] send
# the sequences of user-keys in tmux/.tmux.conf.
[[keyboard.bindings]]
chars = "\u001b[5;30001~"
key = "LBracket"
mods = "Alt|Super"

[[keyboard.bindings]]
chars = "\u001b[5;30002~"
key = "RBracket"
mods = "Alt|Super"
