# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6
# https://github.com/alacritty/alacritty/issues/6802
set-option -sa terminal-features ',alacritty:RGB'
set-option -ga terminal-features ",alacritty:usstyle"
set -ag terminal-overrides ",alacritty:RGB"
set -g default-terminal "alacritty"

set -g base-index 1

# https://stackoverflow.com/a/60929948/458610
set -g set-clipboard on

set -g mouse on

set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#T"
set -g allow-rename on

set -g status-left ""
# Claude model and usage plus session name does not fit tmux' default of 40.
set -g status-right-length 120
# Claude model, context and limit usage, but only for panes that run claude and
# only when there is something to show. @claude_model and @claude_context are
# per pane, because they are that claude's conversation, and
# update-claude-context-tmux.sh sets them from Claude's status line.
# @claude_usage is global, because the limits are the account's and the same
# everywhere, and update-claude-usage-tmux.sh sets it from Claude's hooks. Any
# of them can be missing, hence the space before a part only when something
# follows it. Keeping the pane check here (instead of in a script) means it is
# re-evaluated on every redraw, unlike #() output, which tmux caches per command
# and shares between panes.
set -g status-right "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{||:#{@claude_model},#{||:#{@claude_context},#{@claude_usage}}}},#[fg=$THEME_FG3][claude #[bold]#{@claude_model}#{?#{&&:#{@claude_model},#{||:#{@claude_context},#{@claude_usage}}}, ,}#{@claude_context}#{?#{&&:#{@claude_context},#{@claude_usage}}, ,}#{@claude_usage}#[nobold]] #[none],}#[fg=$THEME_FG3,bold]#(tmux display-message -p '#S')#[none]#{?#{@description}, #[dim]#{@description}#[none],} #{?client_prefix,#[fg=THEME_FG2]<C-b>#[none] ,}"
set -g status-style "bg=$THEME_BG0"
set -g message-style "bg=$THEME_BG0,fg=$THEME_FG1"
set -g window-status-style "bg=$THEME_BG0,fg=$THEME_FG1"
set -g window-status-current-style "bg=$THEME_BG3,fg=$THEME_WHITE,bold"
set -g pane-border-style "bg=$THEME_BG0,fg=$THEME_BG0"
set -g pane-active-border-style "bg=$THEME_BG0,fg=$THEME_BG0"

set -g status-position top

setw -g window-status-separator ""

setw -g window-status-format " #I #W "

setw -g window-status-current-format " #I #W "

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# On macOS, you might want to disable "System Settings -> Keyboard -> Keyboard Shortcuts -> Input Sources -> Select the previous input source"
# because it overrides the key binding.
bind -n C-Space popup -E '$SHELL -c mux'

bind . command-prompt -I "#{@description}" -p "session description:" "set-option @description '%%'"

bind o run 'tmux kill-session -a -t "#S"' \; display-message "Sessions killed..."

bind x popup -E '$SHELL -c mux' \; run 'tmux kill-session -t "#S"'

set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Double-click selects the whole whitespace-delimited token under the cursor
# (so a URL stays in one piece), copies it, and stays in copy mode so it can be
# reviewed before pasting. word-separators is whitespace-only here; tmux's
# default splits URLs apart on / : . etc. The copy-mode-vi binding handles
# double-clicks made while already in copy mode (the root binding forwards those
# via send-keys -M).
set -g word-separators " "
bind-key -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode ; send-keys -X select-word ; send-keys -X copy-pipe-no-clear "#{@override_copy_command}" }
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "#{@override_copy_command}"

bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'M-Left' if-shell "$is_vim" 'send-keys M-Left' 'select-pane -L'
bind-key -n 'M-Down' if-shell "$is_vim" 'send-keys M-Down' 'select-pane -D'
bind-key -n 'M-Up' if-shell "$is_vim" 'send-keys M-Up' 'select-pane -U'
bind-key -n 'M-Right' if-shell "$is_vim" 'send-keys M-Right' 'select-pane -R'
bind-key -T copy-mode-vi 'M-Left' select-pane -L
bind-key -T copy-mode-vi 'M-Down' select-pane -D
bind-key -T copy-mode-vi 'M-Up' select-pane -U
bind-key -T copy-mode-vi 'M-Right' select-pane -R

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-yank defaults mouse yank to X PRIMARY on Linux, which the VirtualBox
# shared-clipboard bridge ignores (it only syncs CLIPBOARD to the host).
# Route mouse yank to CLIPBOARD so guest selections reach the host. No-op on
# macOS — `pbcopy` is the single system clipboard there.
set -g @yank_selection_mouse 'clipboard'

# Keep selection after yank instead of cancelling copy mode.
set -g @yank_action 'copy-pipe'

# Right-trim every line, remove the indent that all lines share, and undo
# line wraps that the sender made with real newlines. See ~/sh/clean-yank.py
# for why each of the three is needed. tmux-yank routes all of its copy paths
# through this option, so the mouse drag, `y` and the double-click bindings
# above all get the filter. Cmd+C in alacritty/.config/alacritty/macos.toml
# reads the same option.
set -g @override_copy_command "zsh -c 'python3 ~/sh/clean-yank.py | clip'"

# Same filter, but the line wraps stay. The reflow has to guess where a
# wrapped line ends, so this is the escape hatch when it guesses wrong.
bind-key -T copy-mode-vi R send-keys -X copy-pipe-no-clear "zsh -c 'python3 ~/sh/clean-yank.py --no-reflow | clip'"

run '~/.tmux/plugins/tpm/tpm'

# Install all tmux plugins on startup, tmux and tpm are installed via nix.
# Assume that we need to install plugins if tmux-sensible is not there.
if "test ! -d ~/.tmux/plugins/tmux-sensible" \
   "run '~/.tmux/plugins/tpm/bin/install_plugins'"
