# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6
# https://github.com/alacritty/alacritty/issues/6802
set-option -sa terminal-features ',alacritty:RGB'
set-option -ga terminal-features ",alacritty:usstyle"
set -ag terminal-overrides ",alacritty:RGB"
# Termius sends TERM=xterm-256color and draws 24-bit colour, but its terminfo
# does not say so, and tmux then rounds every #rrggbb to the 256 palette.
set-option -sa terminal-features ',xterm*:RGB'
# Termius does not dim (SGR 2) RGB colours, and tmux sends it only those. So
# for Termius, dim is $THEME_FG1 at 66%, the colour that alacritty draws.
set-option -saF terminal-overrides ",xterm*:dim=\\E[38;2;\
#{e|/:#{e|*:#{s/^.(..).*/0x\\1/;l:$THEME_FG1},66},100};\
#{e|/:#{e|*:#{s/^...(..).*/0x\\1/;l:$THEME_FG1},66},100};\
#{e|/:#{e|*:#{s/^.....(..)/0x\\1/;l:$THEME_FG1},66},100}m"
set -g default-terminal "alacritty"

set -g base-index 1

# https://stackoverflow.com/a/60929948/458610
set -g set-clipboard on

set -g mouse on

set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#T"
set -g allow-rename on

# notify.sh closes its desktop notification with a pane-focus-in hook on the
# pane that it came from. tmux fires that hook only when the pane goes from no
# focused client to one, so the hook stays quiet when a client comes to a pane
# that another client already shows. Alacritty at home that the user left in
# focus holds the pane like that. A client that dropped with its connection
# does too, because tmux then removes the client but does not check the focus
# again. These hooks run the pane-focus-in hook of the pane that a client comes
# to, gets focus on or types in, whether over SSH or not.
set-hook -g client-attached 'set-hook -R pane-focus-in'
set-hook -g client-session-changed 'set-hook -R pane-focus-in'
set-hook -g session-window-changed 'set-hook -R pane-focus-in'
set-hook -g client-focus-in 'set-hook -R pane-focus-in'
set-hook -g client-active 'set-hook -R pane-focus-in'

set -g status-left ""
# Nothing on the right gets cut by a length: the parts below leave the window
# list its columns themselves, and 500 is past any terminal.
set -g status-right-length 500

# The right side is four parts, most important first:
#
#   1. the window list, which tmux draws itself and always gets its columns;
#   2. the session name, which also shows whether this client came in over SSH;
#   3. the session description;
#   4. Claude's model, effort, context, 5h limit and 7d limit, which are five
#      parts.
#
# A part shows only when it fits next to the parts above it, so a terminal that
# runs out of room drops Claude first (the 7d limit, then the 5h limit, then
# the context, then the effort, then the model), then the description, then the
# name, and the window list keeps its columns whatever happens. Each part is a
# format of its own, which status-right both draws with #{E:} and measures with
# #{w:}, so no width is written down anywhere.
#
# The context and the limits also have a short version, which leaves out the
# cells of the bar: "[53%]", not "[||||||     53%]". The limits have a shortest
# one too, which also leaves out the reset time: "5h [53%]", not
# "5h [53%] 17:59". Claude drops a part only when the shortest versions do not
# fit. What is left then goes to the longer versions, in the order above:
# first the reset times, then the long bars. So as the room gets less, the 7d
# bar goes short first, then the 5h bar, then the context bar, then the 7d
# reset time, then the 5h reset time, and only then does a part go. The room
# of a part that goes can give the others their longer versions back.
#
# The order they are drawn in is not that order: Claude comes first, then the
# name, then the description at the right edge.
#
# The bar borrows the grammar of neovim's statusline, so that both read as one
# app:
#
#   - The model and the session name are chips, white and bold on $THEME_BG3.
#     That is the TabLineSel highlight, which neovim uses for the git branch,
#     the cursor position and the current tab, and which the current window
#     below already uses.
#   - The effort, the context and the limits are plain status text, which
#     status-style below makes the colour of a window that is not current. They
#     read as a row of tabs that way, and only the two chips stand out.
#   - The session description is muted text, like neovim's file info, and is
#     cut at 40 characters.
#   - Over SSH, the session name is yellow and not white, like the [ssh] of the
#     zsh prompt. Yellow is also what neovim uses for a warning such as [W2].
#     The name says it by its colour and not with an [ssh] of its own, because
#     that took seven columns, which a phone needs for Claude's limits.
#   - The prefix indicator is black and bold on $THEME_YELLOW, which is the
#     IncSearch highlight, because both mean "something is pending".
#
# Every part is a tab: it pads itself with a space on each side, like
# window-status-format below, and nothing goes between two of them. That leaves
# a two space gap wherever two parts meet, whichever ones show up, and every
# part can be missing.

# Claude's model, effort, context and limits, but only for panes that run
# claude and only when there is something to show. They are five parts and not
# one, because together they are about 100 columns, and a phone then keeps the
# ones that fit instead of losing all of them. @claude_model,
# @claude_effort and @claude_context are per pane, because they are that
# claude's conversation, and update-claude-status-tmux.sh sets them from
# Claude's status line.
# @claude_usage_5h and @claude_usage_7d are global, because the limits are the
# account's and the same everywhere, and update-claude-usage-tmux.sh sets them
# from Claude's hooks.
# Keeping the pane check here (instead of in a script) means it is re-evaluated
# on every redraw, unlike #() output, which tmux caches per command and shares
# between panes.
#
# The context and the limits arrive as whole bars ("[||||||     53%]", not
# "53"), which bar.sh draws in htop's colours. The limits bring their own "5h"
# and "7d" names from claude-usage.sh, while the context gets its "ctx" here.
# That is also what keeps their "%": a literal one in a status format does not
# survive, because tmux runs the format through strftime, twice for the branch
# of a condition, and "%#" of "%%#[default]" reads as a date format with a
# flag, so the sign gets dropped. A "%" inside the value of an option is
# safe, because tmux does not read what a #{} put there again, while the styles
# in it do still apply.
#
# The short bars are the long ones with the cells cut out, so that bar.sh and
# the scripts that call it need no second output. @short_bar matches the cells,
# the colour before them and the padding of the number, and keeps the colour of
# the number. @reset_time matches what comes after the last "]" of a limit,
# which is the space and the reset time after its bar. Both are in single
# quotes, so that tmux keeps the backslashes and the "$".
set -g @short_bar '#\[fg=[a-z]+\][|]*#\[fg=brightblack.bold\] *(#\[fg=[a-z]+.bold\]) *'
set -g @reset_time ' [^]]*$'
set -g @part_claude_model "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{@claude_model}},#[fg=$THEME_WHITE]#[bg=$THEME_BG3]#[bold] #{@claude_model} #[default],}"
set -g @part_claude_effort "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{@claude_effort}}, #{@claude_effort} ,}"
set -g @part_claude_context "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{@claude_context}}, ctx #{@claude_context} ,}"
set -g @part_claude_context_short "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{@claude_context}}, ctx #{s/#{@short_bar}/\\1/:@claude_context} ,}"
set -g @part_claude_5h "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{@claude_usage_5h}}, #{@claude_usage_5h} ,}"
set -g @part_claude_5h_short "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{@claude_usage_5h}}, #{s/#{@short_bar}/\\1/:@claude_usage_5h} ,}"
set -g @part_claude_5h_shortest "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{@claude_usage_5h}}, #{s/#{@reset_time}//:#{s/#{@short_bar}/\\1/:@claude_usage_5h}} ,}"
set -g @part_claude_7d "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{@claude_usage_7d}}, #{@claude_usage_7d} ,}"
set -g @part_claude_7d_short "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{@claude_usage_7d}}, #{s/#{@short_bar}/\\1/:@claude_usage_7d} ,}"
set -g @part_claude_7d_shortest "#{?#{&&:#{m:*claude*,#{pane_current_command}},#{@claude_usage_7d}}, #{s/#{@reset_time}//:#{s/#{@short_bar}/\\1/:@claude_usage_7d}} ,}"
# #{session_name}, not #(tmux display-message -p '#S'): tmux runs a #() in the
# background and gives an empty string until it answers, and a name that
# measures as empty hands the description room that is not there.
#
# The name is yellow when this client came in over SSH. That is per client and
# not per pane, because one session can have a client at home and a client on
# the phone at the same time, and a shell only has the SSH_* variables of the
# client that started it. is-over-ssh.sh looks for an sshd among the ancestors
# of the tmux client instead. tmux keeps #() output per client, and the command
# holds the pid, so two clients never share an answer. The #() only picks the
# colour, so the name has its width before it answers.
set -g @part_name "#[fg=#{?#(~/sh/is-over-ssh.sh #{client_pid}),$THEME_YELLOW,$THEME_WHITE}]#[bg=$THEME_BG3]#[bold] #{session_name} #[default]"
set -g @part_description "#{?#{@description}, #[fg=$THEME_FG2]#{=/40/…:@description}#[default] ,}"

# The columns a part needs, with the style sequences taken out, because those
# draw nothing: "#[fg=red]x" is one column, not eleven. #{w:} and not #{n:},
# because a description can hold anything and the cut mark itself is three
# bytes wide and one column.
set -g @width_claude_model "#{w:#{s/#\[[^]]*\]//:#{E:@part_claude_model}}}"
set -g @width_claude_effort "#{w:#{s/#\[[^]]*\]//:#{E:@part_claude_effort}}}"
set -g @width_claude_context "#{w:#{s/#\[[^]]*\]//:#{E:@part_claude_context}}}"
set -g @width_claude_context_short "#{w:#{s/#\[[^]]*\]//:#{E:@part_claude_context_short}}}"
set -g @width_claude_5h "#{w:#{s/#\[[^]]*\]//:#{E:@part_claude_5h}}}"
set -g @width_claude_5h_short "#{w:#{s/#\[[^]]*\]//:#{E:@part_claude_5h_short}}}"
set -g @width_claude_5h_shortest "#{w:#{s/#\[[^]]*\]//:#{E:@part_claude_5h_shortest}}}"
set -g @width_claude_7d "#{w:#{s/#\[[^]]*\]//:#{E:@part_claude_7d}}}"
set -g @width_claude_7d_short "#{w:#{s/#\[[^]]*\]//:#{E:@part_claude_7d_short}}}"
set -g @width_claude_7d_shortest "#{w:#{s/#\[[^]]*\]//:#{E:@part_claude_7d_shortest}}}"
set -g @width_name "#{w:#{s/#\[[^]]*\]//:#{E:@part_name}}}"
set -g @width_description "#{w:#{s/#\[[^]]*\]//:#{E:@part_description}}}"
# A tab is window-status-format, window-status-current-format is the same, and
# window-status-separator is empty, so the list is as wide as that format for
# every window put together.
set -g @width_tabs "#{w:#{W:#{E:window-status-format}}}"

# What a part has to fit in: the screen, less the window list and the parts
# that come before it. The prefix indicator is left out of the sum, because it
# lasts one keypress and making the other parts jump for it would be worse.
# The Claude parts count with their shortest versions here.
set -g @room_for_name "#{e|-:#{client_width},#{E:@width_tabs}}"
set -g @room_for_description "#{e|-:#{E:@room_for_name},#{E:@width_name}}"
set -g @room_for_claude_model "#{e|-:#{E:@room_for_description},#{E:@width_description}}"
set -g @room_for_claude_effort "#{e|-:#{E:@room_for_claude_model},#{E:@width_claude_model}}"
set -g @room_for_claude_context "#{e|-:#{E:@room_for_claude_effort},#{E:@width_claude_effort}}"
set -g @room_for_claude_5h "#{e|-:#{E:@room_for_claude_context},#{E:@width_claude_context_short}}"
set -g @room_for_claude_7d "#{e|-:#{E:@room_for_claude_5h},#{E:@width_claude_5h_shortest}}"

# Whether the shortest 5h and 7d limits fit, as 1 or 0, which the sums below
# multiply with.
set -g @shows_claude_5h "#{e|>=:#{E:@room_for_claude_5h},#{E:@width_claude_5h_shortest}}"
set -g @shows_claude_7d "#{e|>=:#{E:@room_for_claude_7d},#{E:@width_claude_7d_shortest}}"

# The columns that a longer version adds to the one below it.
set -g @extra_claude_context_bar "#{e|-:#{E:@width_claude_context},#{E:@width_claude_context_short}}"
set -g @extra_claude_5h_reset "#{e|-:#{E:@width_claude_5h_short},#{E:@width_claude_5h_shortest}}"
set -g @extra_claude_5h_bar "#{e|-:#{E:@width_claude_5h},#{E:@width_claude_5h_short}}"
set -g @extra_claude_7d_reset "#{e|-:#{E:@width_claude_7d_short},#{E:@width_claude_7d_shortest}}"
set -g @extra_claude_7d_bar "#{e|-:#{E:@width_claude_7d},#{E:@width_claude_7d_short}}"

# What the longer versions have to fit in, in the order they get it: the room
# that is left after the shortest versions of the Claude parts that show, less
# what the longer versions before them take. A limit that does not show takes
# nothing. A longer version that does not fit leaves less than nothing to the
# ones after it, so none of those fit either.
set -g @room_for_claude_5h_reset "#{e|-:#{e|-:#{E:@room_for_claude_5h},#{e|*:#{E:@shows_claude_5h},#{E:@width_claude_5h_shortest}}},#{e|*:#{E:@shows_claude_7d},#{E:@width_claude_7d_shortest}}}"
set -g @room_for_claude_7d_reset "#{e|-:#{E:@room_for_claude_5h_reset},#{e|*:#{E:@shows_claude_5h},#{E:@extra_claude_5h_reset}}}"
set -g @room_for_claude_context_bar "#{e|-:#{E:@room_for_claude_7d_reset},#{e|*:#{E:@shows_claude_7d},#{E:@extra_claude_7d_reset}}}"
set -g @room_for_claude_5h_bar "#{e|-:#{E:@room_for_claude_context_bar},#{E:@extra_claude_context_bar}}"
set -g @room_for_claude_7d_bar "#{e|-:#{E:@room_for_claude_5h_bar},#{E:@extra_claude_5h_bar}}"

# The continued lines start at column 0, because tmux keeps the indent of a
# continued line inside the string.
set -g status-right \
"#{?#{e|>=:#{E:@room_for_claude_model},#{E:@width_claude_model}},#{E:@part_claude_model},}\
#{?#{e|>=:#{E:@room_for_claude_effort},#{E:@width_claude_effort}},#{E:@part_claude_effort},}\
#{?#{e|>=:#{E:@room_for_claude_context},#{E:@width_claude_context_short}},#{?#{e|>=:#{E:@room_for_claude_context_bar},#{E:@extra_claude_context_bar}},#{E:@part_claude_context},#{E:@part_claude_context_short}},}\
#{?#{E:@shows_claude_5h},#{?#{e|>=:#{E:@room_for_claude_5h_bar},#{E:@extra_claude_5h_bar}},#{E:@part_claude_5h},#{?#{e|>=:#{E:@room_for_claude_5h_reset},#{E:@extra_claude_5h_reset}},#{E:@part_claude_5h_short},#{E:@part_claude_5h_shortest}}},}\
#{?#{E:@shows_claude_7d},#{?#{e|>=:#{E:@room_for_claude_7d_bar},#{E:@extra_claude_7d_bar}},#{E:@part_claude_7d},#{?#{e|>=:#{E:@room_for_claude_7d_reset},#{E:@extra_claude_7d_reset}},#{E:@part_claude_7d_short},#{E:@part_claude_7d_shortest}}},}\
#{?#{e|>=:#{E:@room_for_name},#{E:@width_name}},#{E:@part_name},}\
#{?#{e|>=:#{E:@room_for_description},#{E:@width_description}},#{E:@part_description},}\
#{?client_prefix,#[fg=$THEME_BLACK]#[bg=$THEME_YELLOW]#[bold] C-b #[default],}"
set -g status-style "bg=$THEME_BG0,fg=$THEME_FG1"
set -g message-style "bg=$THEME_BG0,fg=$THEME_FG1"
set -g window-status-style "bg=$THEME_BG0,fg=$THEME_FG1"
set -g window-status-current-style "bg=$THEME_BG3,fg=$THEME_WHITE,bold"
set -g pane-border-style "bg=$THEME_BG0,fg=$THEME_BG0"
set -g pane-active-border-style "bg=$THEME_BG0,fg=$THEME_BG0"

# The theme's background, foreground and first 16 colours, the same ones that
# alacritty has, so that a client with its own palette (Termius) shows the
# theme too. tmux sends them to every client as RGB, so alacritty looks the same.
# Bold text in one of the first 8 colours gets the bright one (8 to 15).
set -g window-style "bg=$THEME_BG0,fg=$THEME_FG1"
# window-style does not apply to popups (mux), so they get the same colours.
set -g popup-style "bg=$THEME_BG0,fg=$THEME_FG1"
set -g popup-border-style "bg=$THEME_BG0,fg=$THEME_FG1"
set -g pane-colours[0] "$THEME_BLACK"
set -g pane-colours[1] "$THEME_RED"
set -g pane-colours[2] "$THEME_GREEN"
set -g pane-colours[3] "$THEME_YELLOW"
set -g pane-colours[4] "$THEME_BLUE"
set -g pane-colours[5] "$THEME_MAGENTA"
set -g pane-colours[6] "$THEME_CYAN"
set -g pane-colours[7] "$THEME_WHITE"
set -g pane-colours[8] "$THEME_BRIGHT_BLACK"
set -g pane-colours[9] "$THEME_BRIGHT_RED"
set -g pane-colours[10] "$THEME_BRIGHT_GREEN"
set -g pane-colours[11] "$THEME_BRIGHT_YELLOW"
set -g pane-colours[12] "$THEME_BRIGHT_BLUE"
set -g pane-colours[13] "$THEME_BRIGHT_MAGENTA"
set -g pane-colours[14] "$THEME_BRIGHT_CYAN"
set -g pane-colours[15] "$THEME_BRIGHT_WHITE"

set -g status-position top

setw -g window-status-separator ""

setw -g window-status-format " #I #W "

setw -g window-status-current-format " #I #W "

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# On macOS, you might want to disable "System Settings -> Keyboard -> Keyboard Shortcuts -> Input Sources -> Select the previous input source"
# because it overrides the key binding.
#
# A popup is half of the terminal by default, which is too small for fzf on a
# phone, so a narrow client gets all of it.
bind -n C-Space if -F '#{e|<:#{client_width},120}' { popup -E -w 100% -h 100% '$SHELL -c mux' } { popup -E '$SHELL -c mux' }

bind . command-prompt -I "#{@description}" -p "session description:" "set-option @description '%%'"

bind o run 'tmux kill-session -a -t "#S"' \; display-message "Sessions killed..."

bind x if -F '#{e|<:#{client_width},120}' { popup -E -w 100% -h 100% '$SHELL -c mux' } { popup -E '$SHELL -c mux' } \; run 'tmux kill-session -t "#S"'

set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Termius on iOS sends a one-finger swipe as Up/Down, the same bytes as its
# arrow keys, so a swipe cycles shell history. A two-finger swipe down sends
# PageUp, which here goes into copy mode, as the mouse wheel does. Full-screen
# apps (vim, less) still get PageUp. A PageDown out of copy mode has nothing to
# scroll, and zsh would put a ~ in the prompt, so only full-screen apps get it.
bind-key -n PageUp if -F '#{alternate_on}' { send-keys PageUp } { copy-mode -eu }
bind-key -n PageDown if -F '#{alternate_on}' { send-keys PageDown }

# The window keys of alacritty and of Termius. A terminal over SSH has no Super
# key to send, so alacritty on macOS sends Cmd+digit as Alt+digit too.
# Alacritty sends the keys and does not run tmux itself, see
# alacritty/.config/alacritty/nixos.toml for why.
bind-key -n M-t new-window -c ~
bind-key -n M-w kill-pane
bind-key -n 'M-{' select-window -t -1
bind-key -n 'M-}' select-window -t +1
# Alt+Super+[ and ] on NixOS and Cmd+Alt+[ and ] on macOS, which alacritty
# sends as these sequences.
set -s user-keys[0] "\e[5;30001~"
set -s user-keys[1] "\e[5;30002~"
bind-key -n User0 swap-window -t -1 \; select-window -t -1
bind-key -n User1 swap-window -t +1 \; select-window -t +1
# Cmd+C and Cmd+arrows, which alacritty on macOS sends as these sequences.
# Cmd+C reads the same copy command as every other copy path, see
# @override_copy_command below. Cmd+arrows select the pane also in vim, which
# Alt+arrows do not.
set -s user-keys[2] "\e[5;30003~"
set -s user-keys[3] "\e[5;30004~"
set -s user-keys[4] "\e[5;30005~"
set -s user-keys[5] "\e[5;30006~"
set -s user-keys[6] "\e[5;30007~"
bind-key -n User2 if -F '#{pane_in_mode}' { send-keys -X copy-pipe "#{@override_copy_command}" }
bind-key -n User3 select-pane -L
bind-key -n User4 select-pane -R
bind-key -n User5 select-pane -U
bind-key -n User6 select-pane -D
bind-key -n M-1 select-window -t 1
# A number past the last window selects the last window. renumber-windows
# keeps the windows at 1 to session_windows, so the count is the last index.
bind-key -n M-2 if -F '#{e|<:#{session_windows},2}' { select-window -t '{end}' } { select-window -t 2 }
bind-key -n M-3 if -F '#{e|<:#{session_windows},3}' { select-window -t '{end}' } { select-window -t 3 }
bind-key -n M-4 if -F '#{e|<:#{session_windows},4}' { select-window -t '{end}' } { select-window -t 4 }
bind-key -n M-5 if -F '#{e|<:#{session_windows},5}' { select-window -t '{end}' } { select-window -t 5 }
bind-key -n M-6 if -F '#{e|<:#{session_windows},6}' { select-window -t '{end}' } { select-window -t 6 }
bind-key -n M-7 if -F '#{e|<:#{session_windows},7}' { select-window -t '{end}' } { select-window -t 7 }
bind-key -n M-8 if -F '#{e|<:#{session_windows},8}' { select-window -t '{end}' } { select-window -t 8 }
bind-key -n M-9 if -F '#{e|<:#{session_windows},9}' { select-window -t '{end}' } { select-window -t 9 }
bind-key -n M-0 if -F '#{e|<:#{session_windows},10}' { select-window -t '{end}' } { select-window -t 10 }

# Double-click selects the whole whitespace-delimited token under the cursor
# (so a URL stays in one piece), copies it, and stays in copy mode so it can be
# reviewed before pasting. word-separators is whitespace-only here; tmux's
# default splits URLs apart on / : . etc. The copy-mode-vi binding handles
# double-clicks made while already in copy mode (the root binding forwards those
# via send-keys -M).
set -g word-separators " "
bind-key -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode ; send-keys -X select-word ; send-keys -X copy-pipe-no-clear "#{@override_copy_command}" }
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "#{@override_copy_command}"

bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'M-Left' if-shell "$is_vim" 'send-keys M-Left' 'select-pane -L'
bind-key -n 'M-Down' if-shell "$is_vim" 'send-keys M-Down' 'select-pane -D'
bind-key -n 'M-Up' if-shell "$is_vim" 'send-keys M-Up' 'select-pane -U'
bind-key -n 'M-Right' if-shell "$is_vim" 'send-keys M-Right' 'select-pane -R'
bind-key -T copy-mode-vi 'M-Left' select-pane -L
bind-key -T copy-mode-vi 'M-Down' select-pane -D
bind-key -T copy-mode-vi 'M-Up' select-pane -U
bind-key -T copy-mode-vi 'M-Right' select-pane -R

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-yank defaults mouse yank to X PRIMARY on Linux, which the VirtualBox
# shared-clipboard bridge ignores (it only syncs CLIPBOARD to the host).
# Route mouse yank to CLIPBOARD so guest selections reach the host. No-op on
# macOS — `pbcopy` is the single system clipboard there.
set -g @yank_selection_mouse 'clipboard'

# Keep selection after yank instead of cancelling copy mode.
set -g @yank_action 'copy-pipe'

# Right-trim every line, remove the indent that all lines share, and undo
# line wraps that the sender made with real newlines. See ~/sh/clean-yank.py
# for why each of the three is needed. tmux-yank routes all of its copy paths
# through this option, so the mouse drag, `y` and the double-click bindings
# above all get the filter. Cmd+C of alacritty on macOS (User2 above) reads the
# same option.
set -g @override_copy_command "zsh -c 'python3 ~/sh/clean-yank.py | clip'"

# Same filter, but the line wraps stay. The reflow has to guess where a
# wrapped line ends, so this is the escape hatch when it guesses wrong.
bind-key -T copy-mode-vi R send-keys -X copy-pipe-no-clear "zsh -c 'python3 ~/sh/clean-yank.py --no-reflow | clip'"

run '~/.tmux/plugins/tpm/tpm'

# Install all tmux plugins on startup, tmux and tpm are installed via nix.
# Assume that we need to install plugins if tmux-sensible is not there.
if "test ! -d ~/.tmux/plugins/tmux-sensible" \
   "run '~/.tmux/plugins/tpm/bin/install_plugins'"
